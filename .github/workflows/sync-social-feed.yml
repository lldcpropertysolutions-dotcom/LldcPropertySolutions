name: Sync LLDC social property posts

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lldc-social-feed-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Import tagged Instagram and Facebook posts
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          INSTAGRAM_BUSINESS_ID: ${{ secrets.INSTAGRAM_BUSINESS_ID }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v25.0' }}
        run: node scripts/sync-social-feed.mjs

      - name: Publish feed changes
        shell: bash
        run: |
          if git diff --quiet -- data/social-feed.json; then
            echo "No new LLDCWebsite posts."
            exit 0
          fi
          git config user.name "LLDC Social Feed"
          git config user.email "lldcpropertysolutions@gmail.com"
          git add data/social-feed.json
          git commit -m "Update property feed from social media"
          git push origin HEAD:main
